services:
  - type: web
    name: stockalgo-cloud
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn cloud_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: stockalgo-postgres
          property: connectionString
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: PAPER_ONLY
        value: "true"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: APP_ENV
        value: production
      - key: GROWW_API_KEY
        sync: false
      - key: GROWW_API_SECRET
        sync: false

databases:
  - name: stockalgo-postgres
    region: singapore
    plan: free
    databaseName: stockalgo
    user: stockalgo
