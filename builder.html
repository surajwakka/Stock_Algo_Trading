<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Builder</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b1120;--panel:#111b2e;--panel2:#162238;--line:#263650;--txt:#e6edf7;--mut:#9aabc2;--acc:#5b9cff;--good:#35c98a;--bad:#ff6b78;--shadow:0 12px 32px #02081755}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#14233d 0,#0b1120 55%);color:var(--txt);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px clamp(12px,2vw,26px);background:#101a2beF;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{font-weight:800;font-size:18px;letter-spacing:.02em;margin-right:8px;align-self:center}
.brand span{color:var(--acc)}
.control{display:grid;gap:4px;color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
input,select{min-width:0;background:#0b1425;color:var(--txt);border:1px solid #30425e;border-radius:9px;padding:9px 11px;outline:none;transition:border .16s,box-shadow .16s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #5b9cff22}
button{cursor:pointer;border:1px solid #344967;background:#172640;color:var(--txt);border-radius:9px;padding:9px 13px;transition:transform .15s,background .15s,border .15s}
button:hover{border-color:var(--acc);background:#203653}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:wait}
button.primary{background:linear-gradient(135deg,#367ce7,#5b9cff);border-color:#5b9cff;color:white;font-weight:750;box-shadow:0 5px 18px #367ce733}
button.ghost{background:transparent}
button.x{padding:4px 9px;color:#ff9aa3;border-color:#643a4a}
.layout{display:grid;grid-template-columns:minmax(190px,230px) minmax(0,1fr) minmax(290px,360px);gap:14px;padding:16px clamp(10px,2vw,26px);max-width:1800px;margin:auto;align-items:start}
.panel{background:linear-gradient(180deg,#142138,#111b2e);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);min-width:0}
.panel+.panel{margin-top:14px}
h3{margin:0 0 12px;font-size:12px;color:#b5c7e0;text-transform:uppercase;letter-spacing:.1em}
.subtle{color:var(--mut);font-size:12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 10px}
#palette{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;padding:7px 10px;border:1px solid #30425e;border-radius:9px;cursor:pointer;background:#0c1729;color:#cbd9ed;user-select:none;font-size:12px;font-weight:650;transition:.15s}
.chip:hover{border-color:var(--acc);color:white;background:#193052;transform:translateY(-1px)}
#drop{min-height:112px;border:1px dashed #49617f;border-radius:13px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;background:#0d1728}
#drop.over{border-color:var(--acc);background:#5b9cff14}
#drop .hint{color:var(--mut);align-self:center;margin:auto;text-align:center;padding:14px}
.card{display:flex;flex-wrap:wrap;align-items:center;gap:7px;border:1px solid #334967;border-radius:11px;padding:9px;background:#15243b;max-width:100%}
.card b{font-size:12px;color:#dce9fb;margin-right:4px}
.card label{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:11px}
.card input{width:68px;padding:6px 7px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 122px minmax(0,1fr) auto;gap:7px;margin:8px 0;align-items:center}
.rule input,.rule select{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.row select{max-width:120px}
#metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.m{background:#0c1729;border:1px solid #293d59;border-radius:11px;padding:10px;min-width:0}
.m span{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.m b{font-size:17px;overflow-wrap:anywhere}
#err{color:var(--bad);margin:10px 0;white-space:pre-wrap;background:#451e2a55;border-radius:9px}
.chartbox{margin-bottom:14px;padding:10px;background:#111b2e;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.chartbox small{display:block;color:#b4c5dc;font-weight:700;margin-bottom:7px}
.chartbox>div{width:100%;min-width:0}
#signal{color:var(--mut);padding:9px 0}
.section-note{margin:10px 0 0;color:var(--mut);font-size:11px;line-height:1.55}
.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:#173a35;color:#7ce0b6;font-size:11px;font-weight:700}
@media(max-width:1150px){.layout{grid-template-columns:190px minmax(0,1fr)}.rightcol{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rightcol .panel{margin:0}.rightcol .results{grid-column:1/-1}}
@media(max-width:760px){header{position:relative;align-items:stretch}.brand{width:100%}.control{flex:1 1 125px}.layout{grid-template-columns:1fr;padding:10px}.rightcol{grid-column:auto;display:flex;flex-direction:column}.rightcol .panel{margin:0}.rule{grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr) 34px;gap:5px}.rule input,.rule select{padding:8px 6px;font-size:12px}#drop{min-height:90px}.panel{padding:13px}}
</style>
</head>
<body>
<header>
  <div class="brand">Stock<span>Algo</span> <span class="status">Strategy Lab</span></div>
  <label class="control">Symbol<input id="symbol" value="RELIANCE.NS" size="14" title="Yahoo Finance symbol, or SYNTH for offline demo"></label>
  <label class="control">History<select id="period"><option value="1mo">1 month</option><option value="3mo">3 months</option><option value="6mo">6 months</option><option value="1y">1 year</option><option value="2y" selected>2 years</option><option value="5y">5 years</option><option value="10y">10 years</option></select></label>
  <label class="control">Timeframe<select id="interval"><option value="1d" selected>1 day</option><option value="1h">1 hour</option><option value="15m">15 minutes</option><option value="5m">5 minutes</option></select></label>
  <label class="control">Trading cost %<input id="cost" type="number" min="0" max="5" step="0.01" value="0.05" style="width:110px" title="Total estimated cost per position change, in percent"></label>
  <label class="control">Stop loss %<input id="stop" type="number" min="0" max="99" step="0.25" value="0" style="width:100px"></label>
  <button class="primary" id="run">Run backtest</button>
  <label class="control">Strategy name<input id="sname" placeholder="e.g. EMA Momentum" size="14"></label>
  <button id="save">Save strategy</button>
  <label class="control">Saved strategies<select id="load"><option value="">Choose strategy…</option></select></label>
</header>

<div class="layout">
  <div class="panel">
    <h3>Indicators</h3>
    <input id="indicator-search" placeholder="Search indicators…" style="width:100%;margin-bottom:9px"><div id="palette"></div>
    <p class="section-note">Select an indicator to add it, or drag it into the workspace. Configure its parameters below. Use <code>p_up</code> for the trained ML probability series.</p>
  </div>

  <div>
    <div id="drop"><span class="hint">Drop indicators here</span></div>
    <div id="charts"></div>
    <div id="err"></div>
  </div>

  <div>
    <div class="panel" style="margin-bottom:10px">
      <h3>Entry rules</h3>
      <div class="row"><span>Combine with</span><select id="entry-logic"><option>AND</option><option>OR</option></select></div>
      <div id="entry-rules"></div><button id="entry-add">+ rule</button>
    </div>
    <div class="panel" style="margin-bottom:10px">
      <h3>Exit rules</h3>
      <div class="row"><span>Combine with</span><select id="exit-logic"><option>AND</option><option>OR</option></select></div>
      <div id="exit-rules"></div><button id="exit-add">+ rule</button>
    </div>
    <div class="panel">
      <h3>Results</h3>
      <div id="signal" style="color:var(--mut)">Run a backtest.</div>
      <div id="metrics"></div>
    </div>
  </div>
</div>
<datalist id="ops"></datalist>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#f59e0b','#a78bfa','#22d3ee','#f472b6','#84cc16','#fb923c'];
const OPS = ['>','<','crosses_above','crosses_below'];
let META = {}, counters = {};
const st = { indicators: [], entry: {logic:'AND', rules:[]}, exit: {logic:'AND', rules:[]} };

/* ---------- indicators ---------- */
function addIndicator(type, params, id) {
  counters[type] = (counters[type] || 0) + 1;
  st.indicators.push({ id: id || type.toLowerCase() + '_' + counters[type], type, params: {...(params || META[type].params)} });
  renderIndicators();
}
function operandNames() {
  const n = ['open','high','low','close','volume'];
  st.indicators.forEach(i => META[i.type].outputs.forEach(o => n.push(o ? `${i.id}.${o}` : i.id)));
  n.push('p_up');
  return n;
}
function renderIndicators() {
  const drop = $('drop'); drop.innerHTML = '';
  if (!st.indicators.length) drop.innerHTML = '<span class="hint">Drop indicators here</span>';
  st.indicators.forEach((ind, idx) => {
    const c = document.createElement('div'); c.className = 'card';
    const b = document.createElement('b'); b.textContent = ind.id; c.append(b);
    Object.keys(META[ind.type].params).forEach(k => {
      const l = document.createElement('label'); l.append(k + ' ');
      const inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any'; inp.value = ind.params[k];
      inp.oninput = () => { ind.params[k] = parseFloat(inp.value); };
      l.append(inp); c.append(l);
    });
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕';
    x.onclick = () => { st.indicators.splice(idx, 1); renderIndicators(); };
    c.append(x); drop.append(c);
  });
  $('ops').innerHTML = operandNames().map(n => `<option value="${n}">`).join('');
}

/* ---------- rules ---------- */
function renderRules(which) {
  const box = $(which + '-rules'); box.innerHTML = '';
  st[which].rules.forEach((r, idx) => {
    const row = document.createElement('div'); row.className = 'rule';
    const mk = (key) => { const i = document.createElement('input'); i.setAttribute('list', 'ops'); i.value = r[key];
      i.oninput = () => { r[key] = i.value; }; return i; };
    const op = document.createElement('select');
    OPS.forEach(o => { const e = document.createElement('option'); e.textContent = o; if (o === r.op) e.selected = true; op.append(e); });
    op.onchange = () => { r.op = op.value; };
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕';
    x.onclick = () => { st[which].rules.splice(idx, 1); renderRules(which); };
    row.append(mk('left'), op, mk('right'), x); box.append(row);
  });
  $(which + '-logic').value = st[which].logic;
}
['entry','exit'].forEach(w => {
  $(w + '-add').onclick = () => { st[w].rules.push({left:'close', op:'>', right:'50'}); renderRules(w); };
  $(w + '-logic').onchange = e => { st[w].logic = e.target.value; };
});

/* ---------- state <-> payload ---------- */
function payload() {
  return { symbol: $('symbol').value.trim(), period: $('period').value, interval: $('interval').value,
           indicators: st.indicators, entry: st.entry, exit: st.exit,
           cost: Math.max(0, parseFloat($('cost').value) || 0) / 100,
           stop_pct: Math.max(0, parseFloat($('stop').value) || 0) };
}
function setState(d) {
  st.indicators = (d.indicators || []).map(i => ({...i})); counters = {};
  st.indicators.forEach(i => { const n = parseInt(i.id.split('_').pop()) || 0; counters[i.type] = Math.max(counters[i.type] || 0, n); });
  st.entry = d.entry || {logic:'AND', rules:[]}; st.exit = d.exit || {logic:'AND', rules:[]};
  if (d.symbol) $('symbol').value = d.symbol;
  if (d.period) $('period').value = d.period;
  if (d.interval) $('interval').value = d.interval;
  $('cost').value = ((d.cost ?? 0.0005) * 100).toFixed(3); $('stop').value = d.stop_pct ?? 0;
  renderIndicators(); renderRules('entry'); renderRules('exit');
}

/* ---------- run + draw ---------- */
let charts = [];
function mkChart(parent, h, title) {
  const wrap = document.createElement('div'); wrap.className = 'chartbox';
  wrap.innerHTML = `<small>${title}</small>`; const el = document.createElement('div'); wrap.append(el); parent.append(wrap);
  const ch = LightweightCharts.createChart(el, { width: el.clientWidth, height: h,
    layout: { background: { color: '#171d25' }, textColor: '#8793a3' },
    grid: { vertLines: { color: '#232b36' }, horzLines: { color: '#232b36' } },
    timeScale: { borderColor: '#2a3340' }, rightPriceScale: { borderColor: '#2a3340' } });
  charts.push({ ch, el }); return ch;
}
function belongs(key, id) { return key === id || key.startsWith(id + '.'); }

function draw(d) {
  const root = $('charts'); root.innerHTML = ''; charts = [];
  const main = mkChart(root, 380, $('symbol').value + ' price');
  const cs = main.addCandlestickSeries({ upColor:'#22c55e', downColor:'#ef4444', borderVisible:false, wickUpColor:'#22c55e', wickDownColor:'#ef4444' });
  cs.setData(d.candles);
  cs.setMarkers(d.markers.map(m => m.kind === 'entry'
    ? { time:m.time, position:'belowBar', color:'#22c55e', shape:'arrowUp', text:'B' }
    : { time:m.time, position:'aboveBar', color:'#ef4444', shape:'arrowDown', text:'S' }));
  let ci = 0;
  st.indicators.forEach(ind => {
    const keys = Object.keys(d.series).filter(k => belongs(k, ind.id));
    const target = d.overlay[ind.id] ? main : mkChart(root, 140, ind.id + ' (' + ind.type + ')');
    keys.forEach(k => {
      if (k.endsWith('.dir')) return;
      target.addLineSeries({ color: COLORS[ci++ % COLORS.length], lineWidth: 1.5, priceLineVisible: false, title: k.includes('.') ? k.split('.')[1] : '' })
            .setData(d.series[k]);
    });
  });
  if (d.series.p_up) mkChart(root, 140, 'p_up (ML model, out-of-fold)').addLineSeries({ color: '#f59e0b', lineWidth: 1.5, priceLineVisible: false }).setData(d.series.p_up);
  const eq = mkChart(root, 140, 'Strategy equity (1.0 = start)');
  eq.addLineSeries({ color: '#3b82f6', lineWidth: 2 }).setData(d.equity);
  let busy = false;
  charts.forEach(({ ch }) => ch.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (busy || !r) return; busy = true;
    charts.forEach(o => { if (o.ch !== ch) o.ch.timeScale().setVisibleLogicalRange(r); });
    busy = false;
  }));
  main.timeScale().fitContent();

  const m = d.metrics;
  $('metrics').innerHTML = Object.entries(m).map(([k, v]) =>
    `<div class="m"><span>${k.replace(/_/g,' ')}</span><b class="${k.includes('return') || k.includes('buy') ? (v >= 0 ? 'pos' : 'neg') : ''}">${v}</b></div>`).join('');
  $('signal').innerHTML = `Latest bar: entry <b>${d.latest.entry_now ? 'TRUE' : 'false'}</b>, exit <b>${d.latest.exit_now ? 'TRUE' : 'false'}</b>`;
}
window.addEventListener('resize', () => charts.forEach(({ ch, el }) => ch.applyOptions({ width: el.clientWidth })));

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) { let e = r.statusText; try { e = (await r.json()).detail || e; } catch {} throw new Error(e); }
  return r.json();
}
function validateStrategy() {
  const symbol = $('symbol').value.trim();
  if (!symbol) return 'Enter a valid symbol (for example RELIANCE.NS).';
  if (!st.entry.rules.length) return 'Add at least one entry condition before running a backtest.';
  for (const side of ['entry','exit']) {
    for (let i=0;i<st[side].rules.length;i++) {
      const r=st[side].rules[i];
      if (!r.left.trim() || !r.right.trim()) return `${side} rule ${i+1}: both operands are required.`;
      if (!OPS.includes(r.op)) return `${side} rule ${i+1}: choose a supported operator.`;
    }
  }
  const cost = Number($('cost').value), stop = Number($('stop').value);
  if (!Number.isFinite(cost) || cost < 0 || cost > 5) return 'Trading cost must be between 0 and 5 percent.';
  if (!Number.isFinite(stop) || stop < 0 || stop > 99) return 'Stop loss must be between 0 and 99 percent.';
  for (const ind of st.indicators) {
    for (const [key,value] of Object.entries(ind.params)) {
      if (!Number.isFinite(Number(value)) || Number(value) <= 0) return `${ind.id}: ${key} must be greater than zero.`;
    }
  }
  return '';
}
$('run').onclick = async () => {
  $('err').textContent = '';
  const validationError = validateStrategy();
  if (validationError) { $('err').textContent = validationError; return; }
  $('run').disabled = true; $('run').textContent = 'Running…';
  try { draw(await api('/api/run', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload()) })); }
  catch (e) { $('err').textContent = e.message; }
  $('run').disabled = false; $('run').textContent = 'Run backtest';
};

/* ---------- save / load ---------- */
async function refreshStrategies() {
  const names = await api('/api/strategies');
  $('load').innerHTML = '<option value="">Load…</option>';
  names.forEach(n => { const o = document.createElement('option'); o.textContent = n; $('load').append(o); });
}
$('save').onclick = async () => {
  const n = $('sname').value.trim(); if (!n) return ($('err').textContent = 'Enter a strategy name');
  const validationError = validateStrategy(); if (validationError) return ($('err').textContent = validationError);
  try { await api('/api/strategies/' + encodeURIComponent(n), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload()) }); $('err').textContent = ''; refreshStrategies(); }
  catch (e) { $('err').textContent = e.message; }
};
$('load').onchange = async e => { if (e.target.value) { setState(await api('/api/strategies/' + encodeURIComponent(e.target.value))); $('sname').value = e.target.value; } };

/* ---------- init ---------- */
(async function init() {
  META = await api('/api/indicators');
  const pal = $('palette');
  Object.keys(META).forEach(t => {
    const c = document.createElement('div'); c.className = 'chip'; c.textContent = t; c.dataset.indicator = t.toLowerCase(); c.draggable = true;
    c.ondragstart = e => e.dataTransfer.setData('text/plain', t);
    c.onclick = () => addIndicator(t);
    pal.append(c);
  });
  const drop = $('drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const t = e.dataTransfer.getData('text/plain'); if (META[t]) addIndicator(t); };
  $('indicator-search').addEventListener('input', e => {
    const q=e.target.value.trim().toLowerCase();
    [...pal.children].forEach(chip => chip.hidden = !chip.dataset.indicator.includes(q));
  });
  refreshStrategies().catch(() => {});
  // starter example: EMA trend + RSI filter
  setState({ indicators: [{id:'ema_1', type:'EMA', params:{period:20}}, {id:'rsi_1', type:'RSI', params:{period:14}}],
             entry: {logic:'AND', rules:[{left:'close', op:'crosses_above', right:'ema_1'}, {left:'rsi_1', op:'>', right:'50'}]},
             exit: {logic:'OR', rules:[{left:'close', op:'crosses_below', right:'ema_1'}]} });
})();
</script>
</body>
</html>
